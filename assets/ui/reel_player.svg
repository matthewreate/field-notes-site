<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Field Notes tape machine">
  <style>
    .machine { fill:#f3efe6; stroke:#1d1d1d; stroke-width:4; }
    .panel { fill:#efe8db; stroke:#1d1d1d; stroke-width:3; }
    .reel-ring { fill:none; stroke:#1d1d1d; stroke-width:5; }
    .reel-hub { fill:#e6dfd2; stroke:#1d1d1d; stroke-width:3; }
    .spoke { stroke:#1d1d1d; stroke-width:3; stroke-linecap:round; }
    .tape { stroke:#1d1d1d; stroke-width:3; fill:none; }
    .knob { fill:#e7e2d7; stroke:#1d1d1d; stroke-width:3; }
    .control-surface { fill:#e7e2d7; stroke:#1d1d1d; stroke-width:3; }
    .label { font-family: Georgia, serif; font-size:17px; fill:#1d1d1d; letter-spacing:0.06em; text-anchor:middle; dominant-baseline:middle; }
    .rpm-label { font-family: Georgia, serif; font-size:15px; fill:#1d1d1d; letter-spacing:0.06em; text-anchor:middle; dominant-baseline:middle; }
  </style>

  <rect class="machine" x="20" y="40" width="860" height="340" rx="10" />
  <rect class="panel" x="44" y="68" width="812" height="232" rx="8" />

  <g class="reel reel-left" aria-hidden="true">
    <circle class="reel-ring" cx="250" cy="170" r="90" />
    <g class="reel-left-spinner">
      <line class="spoke" x1="250" y1="90" x2="250" y2="250" />
      <line class="spoke" x1="170" y1="170" x2="330" y2="170" />
      <line class="spoke" x1="194" y1="114" x2="306" y2="226" />
      <line class="spoke" x1="306" y1="114" x2="194" y2="226" />
    </g>
    <circle class="reel-hub" cx="250" cy="170" r="14" />
  </g>

  <g class="reel reel-right" aria-hidden="true">
    <circle class="reel-ring" cx="650" cy="170" r="90" />
    <g class="reel-right-spinner">
      <line class="spoke" x1="650" y1="90" x2="650" y2="250" />
      <line class="spoke" x1="570" y1="170" x2="730" y2="170" />
      <line class="spoke" x1="594" y1="114" x2="706" y2="226" />
      <line class="spoke" x1="706" y1="114" x2="594" y2="226" />
    </g>
    <circle class="reel-hub" cx="650" cy="170" r="14" />
  </g>

  <path class="tape tape-path" d="M340 170 L560 170" />

  <circle class="knob" cx="420" cy="270" r="16" />
  <circle class="knob" cx="480" cy="270" r="16" />

  <g data-action="play" aria-label="Play">
    <rect class="control-surface" x="308" y="320" width="78" height="30" rx="4" />
    <text class="label" x="347" y="336">PLAY</text>
  </g>

  <g data-action="pause" aria-label="Pause">
    <rect class="control-surface" x="392" y="320" width="78" height="30" rx="4" />
    <text class="label" x="431" y="336">PAUSE</text>
  </g>

  <g data-action="stop" aria-label="Stop">
    <rect class="control-surface" x="476" y="320" width="78" height="30" rx="4" />
    <text class="label" x="515" y="336">STOP</text>
  </g>

  <g data-action="rpm33" aria-label="Set thirty three RPM">
    <rect class="control-surface" x="572" y="320" width="56" height="30" rx="4" />
    <text class="rpm-label" x="600" y="336">33</text>
  </g>

  <g data-action="rpm45" aria-label="Set forty five RPM">
    <rect class="control-surface" x="634" y="320" width="56" height="30" rx="4" />
    <text class="rpm-label" x="662" y="336">45</text>
  </g>
</svg>
