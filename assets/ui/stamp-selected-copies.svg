<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#rough)" opacity="0.86">
    <rect x="10" y="20" width="340" height="80" fill="none" stroke="#111" stroke-width="3" rx="6" ry="6"/>
    <rect x="18" y="28" width="324" height="64" fill="none" stroke="#111" stroke-width="1.5" rx="4" ry="4" opacity="0.55"/>
    <text x="180" y="70" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="26" letter-spacing="2" fill="#111">
      SELECTED COPIES
    </text>
  </g>
</svg>
